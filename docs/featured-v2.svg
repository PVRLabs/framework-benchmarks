<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Framework Benchmarks</title>
<desc id="desc">Readiness, application RSS, latency and guest memory headroom for each recorded run. Lower is better for readiness time, application RSS and latency. Higher is better for guest memory headroom.</desc>
