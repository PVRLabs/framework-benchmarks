micronaut.application.name=market-replay-portfolio
micronaut.server.host=127.0.0.1
micronaut.server.port=${SERVER_PORT:8080}
datasources.default.url=${MARKET_DB_URL:jdbc:postgresql://127.0.0.1:5432/fb_baseline}
datasources.default.username=${MARKET_DB_USER:fb_baseline}
datasources.default.password=${MARKET_DB_PASSWORD:fb_baseline}
datasources.default.maximum-pool-size=4
datasources.default.minimum-idle=0
datasources.default.connection-timeout=2000
datasources.default.dialect=POSTGRES
# Empty portfolios still include an empty holdings array.
jackson.serialization-inclusion=ALWAYS
