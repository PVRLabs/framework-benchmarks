quarkus.http.port=${SERVER_PORT:8080}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${MARKET_DB_USER:fb_baseline}
quarkus.datasource.password=${MARKET_DB_PASSWORD:fb_baseline}
quarkus.datasource.jdbc.url=${MARKET_DB_URL:jdbc:postgresql://127.0.0.1:15432/fb_baseline}
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.transaction-isolation-level=read-committed
quarkus.datasource.devservices.enabled=false
