spring.application.name=market-replay-portfolio
spring.profiles.default=h2
spring.datasource.username=${MARKET_DB_USER:market}
spring.datasource.password=${MARKET_DB_PASSWORD:market}
spring.datasource.hikari.minimum-idle=${POOL_MIN_IDLE:1}
spring.datasource.hikari.maximum-pool-size=${POOL_MAX_SIZE:4}
spring.datasource.hikari.connection-timeout=${POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-${spring.profiles.active:${spring.profiles.default}}.sql
market.fixture-url=${MARKET_FIXTURE_URL:http://127.0.0.1:8090/quotes}
market.poll-enabled=${MARKET_POLL_ENABLED:true}
market.poll-interval-ms=${MARKET_POLL_INTERVAL_MS:60000}
market.poll-initial-delay-ms=${MARKET_POLL_INITIAL_DELAY_MS:0}
portfolio.seed-users=${SEED_USERS:1000}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
server.tomcat.threads.max=${HTTP_MAX_THREADS:16}
server.tomcat.threads.min-spare=2
